<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Adega 98 • Gestão de Fiados</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#171717}header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}header .headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}header .back{background:#fff;color:#111;border:0;padding:9px 12px;border-radius:10px;font-weight:800}h1{margin:0;font-size:21px}main{max-width:980px;margin:auto;padding:14px 14px 80px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.label{font-size:12px;color:#6b7280}.big{font-size:21px;font-weight:800;margin-top:5px}.danger{color:#b91c1c}.ok{color:#166534}nav{display:flex;gap:7px;overflow:auto;padding:12px 0}nav button,button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}nav .sel,.primary{background:#111;color:#fff;border-color:#111}section{display:none}.show{display:block}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}.toolbar input{flex:1;min-width:180px}.list{display:grid;gap:10px}.line{display:flex;justify-content:space-between;gap:12px}.muted{color:#6b7280;font-size:13px;margin-top:4px}.money{font-weight:850}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px;font-weight:800}.tag.danger{background:#fee2e2}.tag.ok{background:#dcfce7}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.box{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.form{display:grid;gap:9px}.grid2,.grid3{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{grid-template-columns:1fr 1fr 1fr}.notice{background:#f5f5f5;padding:12px;border-radius:12px;font-size:13px}.empty{text-align:center;padding:30px;color:#6b7280;background:#fff;border:1px dashed #ccc;border-radius:14px}.small{font-size:12px}.check{display:flex;align-items:center;gap:8px;background:#f8f8f8;padding:10px;border-radius:10px}.check input{width:auto}.dangerBtn{color:#b91c1c}.sep{height:1px;background:#eee;margin:14px 0}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:620px){.cards{grid-template-columns:1fr}.line{flex-direction:column}.grid2,.grid3{grid-template-columns:1fr}}
</style></head><body>
<header><div class="headrow"><div><h1>Adega Nove Oito</h1><small>Gestão de Fiados • versão 7.0</small></div><button class="back" onclick="goHome()">← Início</button></div></header>
<main><div class="cards"><div class="card"><div class="label">A receber</div><div class="big" id="total">R$ 0,00</div></div><div class="card"><div class="label">Em atraso</div><div class="big danger" id="late">R$ 0,00</div></div><div class="card"><div class="label">Clientes</div><div class="big" id="count">0</div></div><div class="card"><div class="label">Crédito utilizado</div><div class="big" id="used">R$ 0,00</div></div></div>
<nav><button class="sel" data-tab="home">Início</button><button data-tab="clients">Clientes</button><button data-tab="debts">Fiados</button><button data-tab="reports">Relatórios</button><button data-tab="backup">Backup</button></nav>
<section id="home" class="show"><div class="toolbar"><button class="primary" onclick="newClient()">+ Cliente</button><button class="primary" onclick="newDebt()">+ Fiado</button></div><div id="homeList" class="list"></div></section>
<section id="clients"><div class="toolbar"><input id="search" placeholder="Pesquisar cliente..." oninput="render()"><button class="primary" onclick="newClient()">+ Cliente</button></div><div id="clientList" class="list"></div></section>
<section id="debts"><div class="toolbar"><button class="primary" onclick="newDebt()">+ Lançar fiado</button></div><div id="debtList" class="list"></div></section>
<section id="reports"><div class="card" id="report"></div></section>
<section id="backup"><div class="card"><h3>Backup e dados</h3><p class="muted">Os dados ficam neste navegador/aparelho. Faça backup regularmente.</p><div class="actions"><button class="primary" onclick="backup()">Baixar backup</button><button onclick="document.getElementById('restore').click()">Restaurar</button><button onclick="demo()">Dados de demonstração</button><button class="dangerBtn" onclick="wipe()">Apagar tudo</button></div><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></section>
</main><div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const K='adega98_v1';let db=JSON.parse(localStorage.getItem(K)||'{"clients":[],"debts":[]}');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function localDate(d=new Date()){let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
const today=()=>localDate();
function timeNow(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function close(){modal.classList.remove('open')}function goHome(){close();document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('sel',x.dataset.tab==='home'));document.querySelectorAll('section').forEach(x=>x.classList.toggle('show',x.id==='home'));render()}
function bal(c){return db.debts.filter(d=>d.clientId===c.id).reduce((s,d)=>s+remaining(d),0)}
function interestAmount(d){let base=Math.max(0,Number(d.value||0));let paid=Math.max(0,Number(d.paid||0));let due=d.due?new Date(d.due+'T23:59:59'):null;if(!due)return 0;let now=new Date();if(now<=due)return 0;let weeks=Math.ceil((now-due)/604800000);let rate=Math.max(0,Number(d.interestRate||0))/100;return Math.max(0,base-paid)*rate*weeks}
function remaining(d){if(d.settled)return 0;return Math.max(0,Number(d.value||0)-Number(d.paid||0)+interestAmount(d))}
function late(d){return d.due&&d.due<today()&&remaining(d)>0}
function addDays(dateStr,days){let d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+Number(days||0));return localDate(d)}
function nextPaymentDay(day){let n=Number(day);if(!n)return '';let d=new Date();for(let i=0;i<62;i++){let x=new Date(d);x.setDate(d.getDate()+i);let last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();if(x.getDate()===Math.min(n,last))return localDate(x)}return ''}
function fmtDate(s){if(!s)return '—';let p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function safeClient(id){return db.clients.find(x=>x.id===id)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.querySelectorAll('section').forEach(x=>x.classList.remove('show'));document.getElementById(b.dataset.tab).classList.add('show');render()});
function newClient(id){let c=id?safeClient(id):{};box.innerHTML='<h2>'+(id?'Editar cliente':'Novo cliente')+'</h2><div class="form"><input id="nm" placeholder="Nome *" value="'+esc(c.name)+'"><div class="grid2"><input id="ph" placeholder="WhatsApp / telefone" value="'+esc(c.phone)+'"><input id="cpf" placeholder="CPF" value="'+esc(c.cpf)+'"></div><div class="grid3"><input id="lim" type="number" step=".01" min="0" placeholder="Limite de crédito (R$)" value="'+(c.limit??'')+'"><input id="pday" type="number" min="1" max="31" placeholder="Dia habitual de pagamento" value="'+(c.paymentDay??'')+'"><input id="irate" type="number" step=".01" min="0" placeholder="Juros padrão (%/semana)" value="'+(c.interestRate??'')+'"></div><div class="notice">Dia habitual e juros padrão serão usados como sugestão nos novos fiados. Você poderá alterar cada fiado separadamente.</div><textarea id="addr" placeholder="Endereço">'+esc(c.address)+'</textarea><textarea id="note" placeholder="Observações">'+esc(c.notes)+'</textarea></div><div class="actions"><button onclick="close()">Cancelar</button><button class="primary" onclick="saveClient('+(id||0)+')">Salvar alterações</button></div>'+(id?'<div class="sep"></div><button class="dangerBtn" onclick="deleteClient('+id+')">Excluir cliente</button>':'');modal.classList.add('open')}
function saveClient(id){if(!nm.value.trim())return alert('Informe o nome.');let pd=Math.max(0,Math.min(31,Number(pday.value)||0));let o={name:nm.value.trim(),phone:ph.value.trim(),cpf:cpf.value.trim(),limit:+lim.value||0,paymentDay:pd,interestRate:+irate.value||0,address:addr.value.trim(),notes:note.value.trim()};if(id)Object.assign(db.clients.find(x=>x.id===id),o);else db.clients.push({id:Date.now(),...o});close();save()}
function deleteClient(id){let c=safeClient(id);if(!c)return;let open=bal(c);let msg='Excluir o cliente '+c.name+' e TODO o seu histórico, incluindo '+(open>0?money(open)+' pendente(s)':'qualquer registro')+'? Esta ação não pode ser desfeita.';if(confirm(msg)){db.clients=db.clients.filter(x=>x.id!==id);db.debts=db.debts.filter(d=>d.clientId!==id);close();save()}}
function newDebt(cid){if(!db.clients.length)return alert('Cadastre um cliente primeiro.');let c=safeClient(cid||db.clients[0].id),defaultRate=c?.interestRate||0,defaultDue=c?.paymentDay?nextPaymentDay(c.paymentDay):addDays(today(),7);box.innerHTML='<h2>Novo fiado</h2><div class="form"><select id="dc">'+db.clients.map(x=>'<option value="'+x.id+'" '+(x.id===(cid||c.id)?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><input id="it" placeholder="Produtos / descrição *"><input id="val" type="number" step=".01" min="0" placeholder="Valor (R$) *"><div class="grid3"><input id="days" type="number" min="0" placeholder="Prazo (dias)" value="7"><input id="due" type="date" value="'+defaultDue+'"><input id="rate" type="number" step=".01" min="0" placeholder="Juros (%/semana)" value="'+defaultRate+'"></div><label class="check"><input id="useDay" type="checkbox" '+(c?.paymentDay?'checked':'')+'> Usar dia habitual de pagamento do cliente</label></div><div class="notice" id="ci"></div><div class="actions"><button onclick="close()">Cancelar</button><button class="primary" onclick="saveDebt()">Lançar fiado</button></div><p class="muted small">Os juros são configuráveis e servem apenas como cálculo do sistema. A cobrança de juros/encargos deve respeitar a legislação e as condições aplicáveis ao seu negócio.</p>';modal.classList.add('open');dc.onchange=()=>{let x=safeClient(+dc.value);rate.value=x?.interestRate||0;useDay.checked=!!x?.paymentDay;syncDue()};days.oninput=()=>{if(!useDay.checked)due.value=addDays(today(),+days.value||0);credit()};useDay.onchange=syncDue;val.oninput=credit;due.onchange=credit;rate.oninput=credit;credit();syncDue()}
function syncDue(){let c=safeClient(+dc.value);if(useDay.checked&&c?.paymentDay){due.value=nextPaymentDay(c.paymentDay);days.value=Math.max(0,Math.round((new Date(due.value+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000))}else if(days.value!==''&&document.activeElement!==due)due.value=addDays(today(),+days.value||0);credit()}
function credit(){let c=safeClient(+dc.value),av=Math.max(0,(c?.limit||0)-bal(c)),v=Math.max(0,+val.value||0),ratePct=Math.max(0,+rate.value||0),dueDate=due.value?new Date(due.value+'T23:59:59'):null,interest=0;if(dueDate&&new Date()>dueDate&&ratePct>0){let weeks=Math.ceil((new Date()-dueDate)/604800000);interest=Math.max(0,v)*ratePct/100*weeks}let total=v+interest;ci.innerHTML=(c?.limit?'Limite: '+money(c.limit)+' • Usado: '+money(bal(c))+' • Disponível: '+money(av):'Limite não definido.')+'<br><b>Total previsto para pagar hoje: '+money(total)+'</b>'+(interest?' <span class="danger">(inclui '+money(interest)+' de juros por atraso)</span>':'')+'<br><span class="muted small">Juros: '+ratePct.toLocaleString('pt-BR')+'% por semana após o vencimento.</span>'}
function saveDebt(){let c=safeClient(+dc.value),v=+val.value||0;if(!v)return alert('Informe o valor.');let av=(c.limit||0)-bal(c);if(c.limit&&v>av&&!confirm('Ultrapassa o limite disponível. Lançar mesmo assim?'))return;db.debts.push({id:Date.now(),clientId:c.id,item:it.value.trim()||'Fiado',value:v,paid:0,date:today(),time:timeNow(),due:due.value,interestRate:+rate.value||0});close();save()}
function pay(id){let d=db.debts.find(x=>x.id===id);if(!d)return;let r=remaining(d);box.innerHTML='<h2>Movimentar dívida</h2><div class="notice">Saldo atualizado: <b>'+money(r)+'</b></div><div class="actions"><button class="primary" onclick="partialPay('+id+')">Registrar pagamento parcial</button><button onclick="discountPay('+id+')">Quitar com desconto</button><button onclick="editValuePay('+id+')">Alterar valor da dívida</button><button onclick="close()">Cancelar</button></div><p class="muted small">Escolha uma das três opções para este cliente.</p>';modal.classList.add('open')}
function partialPay(id){let d=db.debts.find(x=>x.id===id),r=remaining(d),v=+prompt('Saldo atualizado: '+money(r)+'\nValor recebido parcialmente:',r);if(!v||v<=0)return;d.paid=Math.min(Number(d.value),Number(d.paid||0)+v);if(d.paid>=d.value&&!interestAmount(d))d.settled=true;close();save()}
function discountPay(id){let d=db.debts.find(x=>x.id===id),r=remaining(d),v=+prompt('Saldo atualizado: '+money(r)+'\nValor recebido para quitar com desconto:',r);if(!v||v<=0||v>r)return alert('Informe um valor válido, até '+money(r)+'.');d.discount=Number((r-v).toFixed(2));d.paid=Math.min(Number(d.value),Number(d.paid||0)+v);d.settled=true;d.settledAt=today();close();save()}
function editValuePay(id){let d=db.debts.find(x=>x.id===id),v=+prompt('Valor atual da dívida: '+money(d.value)+'\nNovo valor da dívida:',d.value);if(!v||v<=0)return;if(v<Number(d.paid||0))return alert('O novo valor não pode ser menor que o total já recebido.');d.value=Number(v.toFixed(2));if(d.paid>=d.value&&!interestAmount(d))d.settled=true;close();save()}
function editDebt(id){let d=db.debts.find(x=>x.id===id);if(!d)return;box.innerHTML='<h2>Editar fiado</h2><div class="form"><input id="eit" placeholder="Produtos / descrição" value="'+esc(d.item)+'"><input id="eval" type="number" step=".01" min="0" value="'+Number(d.value||0)+'"><div class="grid2"><input id="edue" type="date" value="'+(d.due||'')+'"><input id="erate" type="number" step=".01" min="0" value="'+Number(d.interestRate||0)+'" placeholder="Juros (%/semana)"></div><div class="notice">Já recebido: <b>'+money(d.paid)+'</b> • Saldo atual: <b>'+money(remaining(d))+'</b></div></div><div class="actions"><button onclick="close()">Cancelar</button><button class="primary" onclick="saveDebtEdit('+id+')">Salvar</button></div>';modal.classList.add('open')}
function saveDebtEdit(id){let d=db.debts.find(x=>x.id===id);d.item=eit.value.trim()||'Fiado';d.value=Math.max(0,+eval.value||0);d.due=edue.value;d.interestRate=Math.max(0,+erate.value||0);if(d.value<d.paid)alert('O valor do fiado ficou menor que o total já recebido. Revise o lançamento.');close();save()}
function wa(c){let p=(c.phone||'').replace(/\D/g,'');if(!p)return alert('Cadastre o WhatsApp.');if(p.length<=11)p='55'+p;open('https://wa.me/'+p+'?text='+encodeURIComponent('Olá, '+c.name+'! Aqui é da Adega Nove Oito. Seu saldo atualizado em aberto é '+money(bal(c))+'.'),'_blank')}
function customer(id){let c=safeClient(id);if(!c)return;let all=db.debts.filter(d=>d.clientId===id).slice().reverse(),pending=all.filter(d=>remaining(d)>0),paid=all.filter(d=>remaining(d)<=0);let debtHtml=d=>{let r=remaining(d);return '<div class="item"><div class="line"><div><b>'+esc(d.item)+'</b><div class="muted">Lançado '+fmtDate(d.date)+' às '+esc(d.time||'—')+' • vence '+fmtDate(d.due)+' • juros '+Number(d.interestRate||0).toLocaleString('pt-BR')+'%/semana</div></div><b>'+money(r)+'</b></div><div class="actions">'+(r>0?'<button class="primary" onclick="pay('+d.id+')">Registrar pagamento</button>':'')+'<button onclick="editDebt('+d.id+')">Editar fiado</button><button onclick="wa(safeClient('+id+'))">Cobrar WhatsApp</button></div></div>'};box.innerHTML='<h2>'+esc(c.name)+'</h2><div class="notice">Limite: '+(c.limit?money(c.limit):'não definido')+' • Saldo pendente: <b>'+money(bal(c))+'</b> • Disponível: '+(c.limit?money(Math.max(0,c.limit-bal(c))):'—')+'<br>Dia habitual: '+(c.paymentDay||'não definido')+' • Juros padrão: '+Number(c.interestRate||0).toLocaleString('pt-BR')+'%/semana</div><p class="muted">'+esc(c.phone||'')+'<br>'+esc(c.cpf||'')+'<br>'+esc(c.address||'')+(c.notes?'<br>Obs.: '+esc(c.notes): '')+'</p><hr><h3>Pendências em aberto ('+pending.length+')</h3><div class="list">'+(pending.map(debtHtml).join('')||'<div class="empty">Nenhuma pendência em aberto.</div>')+'</div><hr><details><summary><b>Histórico quitado ('+paid.length+')</b></summary><div class="list">'+(paid.map(debtHtml).join('')||'<div class="empty">Nenhum fiado quitado.</div>')+'</div></details><div class="actions"><button class="primary" onclick="close();newDebt('+id+')">+ Fiado</button><button onclick="wa(safeClient('+id+'))">WhatsApp</button><button onclick="close();newClient('+id+')">Editar cliente</button><button class="dangerBtn" onclick="deleteClient('+id+')">Excluir cliente</button><button onclick="goHome()">← Voltar para início</button></div>';modal.classList.add('open')}
function render(){let total=db.clients.reduce((s,c)=>s+bal(c),0),l=db.debts.filter(late).reduce((s,d)=>s+remaining(d),0),used=db.clients.reduce((s,c)=>s+(c.limit?Math.min(c.limit,bal(c)):bal(c)),0);document.getElementById('total').textContent=money(total);document.getElementById('late').textContent=money(l);document.getElementById('count').textContent=db.clients.length;document.getElementById('used').textContent=money(used);
let q=(document.getElementById('search')?.value||'').toLowerCase();clientList.innerHTML=db.clients.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.cpf||'').includes(q)).map(c=>'<div class="item"><div class="line"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.phone||'Sem telefone')+' • Limite '+(c.limit?money(c.limit):'—')+' • Pagamento dia '+(c.paymentDay||'—')+'</div></div><div><b>'+money(bal(c))+'</b><div class="actions"><button onclick="customer('+c.id+')">Abrir</button><button onclick="newDebt('+c.id+')">Fiado</button><button onclick="newClient('+c.id+')">Editar</button><button onclick="wa(safeClient('+c.id+'))">WhatsApp</button></div></div></div></div>').join('')||'<div class="empty">Nenhum cliente.</div>';
debtList.innerHTML=db.debts.slice().reverse().map(d=>{let c=safeClient(d.clientId),r=remaining(d);return '<div class="item"><div class="line"><div><b>'+esc(c?.name||'Cliente')+'</b><div class="muted">'+esc(d.item)+' • lançado '+fmtDate(d.date)+' às '+esc(d.time||'—')+' • vence '+fmtDate(d.due)+' • juros '+Number(d.interestRate||0).toLocaleString('pt-BR')+'%/semana</div></div><div><b>'+money(r)+'</b><div><span class="tag '+(r<=0?'ok':late(d)?'danger':'')+'">'+(r<=0?'PAGO':late(d)?'ATRASADO':'ABERTO')+'</span></div></div></div>'+(r>0?'<div class="actions"><button class="primary" onclick="pay('+d.id+')">Registrar pagamento</button><button onclick="editDebt('+d.id+')">Editar</button><button onclick="wa(safeClient('+d.clientId+'))">Cobrar WhatsApp</button></div>':'<div class="actions"><button onclick="editDebt('+d.id+')">Editar</button></div>')+'</div>'}).join('')||'<div class="empty">Nenhum fiado.</div>';
homeList.innerHTML=db.clients.filter(c=>bal(c)>0).sort((a,b)=>bal(b)-bal(a)).slice(0,8).map(c=>'<div class="item"><div class="line"><b>'+esc(c.name)+'</b><b>'+money(bal(c))+'</b></div><div class="muted">Pagamento habitual: '+(c.paymentDay||'—')+'</div></div>').join('')||'<div class="empty">Nenhum fiado em aberto.</div>';
let sold=db.debts.reduce((s,d)=>s+Number(d.value||0),0),rec=db.debts.reduce((s,d)=>s+Number(d.paid||0),0),interest=db.debts.reduce((s,d)=>s+interestAmount(d),0);report.innerHTML='<h3>Relatório geral</h3><p>Total lançado: <b>'+money(sold)+'</b></p><p>Total recebido: <b>'+money(rec)+'</b></p><p>Juros calculados por atraso: <b>'+money(interest)+'</b></p><p>Saldo aberto: <b>'+money(total)+'</b></p><p>Em atraso: <b class="danger">'+money(l)+'</b></p><p>Clientes com saldo: <b>'+db.clients.filter(c=>bal(c)>0).length+'</b></p>'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-adega98-'+today()+'.json';a.click()}
function restore(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clients||!x.debts)throw 0;db=x;db.clients=db.clients.map(c=>({...c,paymentDay:c.paymentDay||0,interestRate:Number(c.interestRate||0)}));db.debts=db.debts.map(d=>({...d,interestRate:Number(d.interestRate||0)}));save();alert('Backup restaurado.')}catch{alert('Arquivo inválido.')}};if(f)r.readAsText(f)}
