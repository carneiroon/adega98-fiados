<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Adega 98 • Fiados</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#171717}
header{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:21px}main{max-width:900px;margin:auto;padding:14px 14px 80px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.label{font-size:12px;color:#6b7280}.big{font-size:22px;font-weight:800;margin-top:5px}.danger{color:#b91c1c}.ok{color:#166534}
nav{display:flex;gap:7px;overflow:auto;padding:12px 0}nav button,button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700}nav .sel,.primary{background:#111;color:#fff;border-color:#111}
section{display:none}.show{display:block}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}.toolbar input{flex:1;min-width:180px}
.list{display:grid;gap:10px}.line{display:flex;justify-content:space-between;gap:12px}.muted{color:#6b7280;font-size:13px;margin-top:4px}.money{font-weight:850}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.box{background:#fff;width:100%;max-width:680px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.form{display:grid;gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{background:#f5f5f5;padding:12px;border-radius:12px;font-size:13px}.empty{text-align:center;padding:30px;color:#6b7280;background:#fff;border:1px dashed #ccc;border-radius:14px}
@media(max-width:620px){.cards{grid-template-columns:1fr}.line{flex-direction:column}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Adega Nove Oito</h1><small>Gestão de Fiados • versão 1.0</small></header>
<main><div class="cards"><div class="card"><div class="label">A receber</div><div class="big" id="total">R$ 0,00</div></div>
<div class="card"><div class="label">Em atraso</div><div class="big danger" id="late">R$ 0,00</div></div>
<div class="card"><div class="label">Clientes</div><div class="big" id="count">0</div></div></div>
<nav><button class="sel" data-tab="home">Início</button><button data-tab="clients">Clientes</button><button data-tab="debts">Fiados</button><button data-tab="reports">Relatórios</button><button data-tab="backup">Backup</button></nav>
<section id="home" class="show"><div class="toolbar"><button class="primary" onclick="newClient()">+ Cliente</button><button class="primary" onclick="newDebt()">+ Fiado</button></div><div id="homeList" class="list"></div></section>
<section id="clients"><div class="toolbar"><input id="search" placeholder="Pesquisar cliente..." oninput="render()"><button class="primary" onclick="newClient()">+ Cliente</button></div><div id="clientList" class="list"></div></section>
<section id="debts"><div class="toolbar"><button class="primary" onclick="newDebt()">+ Lançar fiado</button></div><div id="debtList" class="list"></div></section>
<section id="reports"><div class="card" id="report"></div></section>
<section id="backup"><div class="card"><h3>Backup e dados</h3><p class="muted">Os dados ficam neste navegador/aparelho. Faça backup regularmente.</p><div class="actions">
<button class="primary" onclick="backup()">Baixar backup</button><button onclick="document.getElementById('restore').click()">Restaurar</button><button onclick="demo()">Dados de demonstração</button><button onclick="wipe()">Apagar tudo</button></div><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></section>
</main><div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const K='adega98_v1';let db=JSON.parse(localStorage.getItem(K)||'{"clients":[],"debts":[]}');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function close(){modal.classList.remove('open')}
function bal(c){return db.debts.filter(d=>d.clientId===c.id).reduce((s,d)=>s+Math.max(0,d.value-d.paid),0)}
function late(d){return d.due&&d.due<today()&&d.value>d.paid}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.querySelectorAll('section').forEach(x=>x.classList.remove('show'));document.getElementById(b.dataset.tab).classList.add('show');render()});
function newClient(id){let c=id?db.clients.find(x=>x.id===id):{};box.innerHTML='<h2>'+(id?'Editar cliente':'Novo cliente')+'</h2><div class="form"><input id="nm" placeholder="Nome *" value="'+(c.name||'')+'"><input id="ph" placeholder="WhatsApp / telefone" value="'+(c.phone||'')+'"><div class="grid2"><input id="cpf" placeholder="CPF (opcional)" value="'+(c.cpf||'')+'"><input id="lim" type="number" step=".01" placeholder="Limite (R$)" value="'+(c.limit||'')+'"></div><textarea id="addr" placeholder="Endereço">'+(c.address||'')+'</textarea><textarea id="note" placeholder="Observações">'+(c.notes||'')+'</textarea></div><div class="actions"><button onclick="close()">Cancelar</button><button class="primary" onclick="saveClient('+(id||0)+')">Salvar</button></div>';modal.classList.add('open')}
function saveClient(id){if(!nm.value.trim())return alert('Informe o nome.');let o={name:nm.value.trim(),phone:ph.value.trim(),cpf:cpf.value.trim(),limit:+lim.value||0,address:addr.value.trim(),notes:note.value.trim()};if(id)Object.assign(db.clients.find(x=>x.id===id),o);else db.clients.push({id:Date.now(),...o});close();save()}
function newDebt(cid){if(!db.clients.length)return alert('Cadastre um cliente primeiro.');box.innerHTML='<h2>Novo fiado</h2><div class="form"><select id="dc">'+db.clients.map(c=>'<option value="'+c.id+'" '+(c.id==cid?'selected':'')+'>'+c.name+'</option>').join('')+'</select><input id="it" placeholder="Produtos / descrição *"><input id="val" type="number" step=".01" placeholder="Valor (R$) *"><input id="due" type="date" value="'+today()+'"></div><div class="notice" id="ci"></div><div class="actions"><button onclick="close()">Cancelar</button><button class="primary" onclick="saveDebt()">Lançar</button></div>';modal.classList.add('open');dc.onchange=credit;val.oninput=credit;credit()}
function credit(){let c=db.clients.find(x=>x.id==+dc.value),av=Math.max(0,(c.limit||0)-bal(c));ci.textContent=c.limit?'Limite: '+money(c.limit)+' • Usado: '+money(bal(c))+' • Disponível: '+money(av):'Limite não definido.'}
function saveDebt(){let c=db.clients.find(x=>x.id==+dc.value),v=+val.value||0;if(!v)return alert('Informe o valor.');let av=(c.limit||0)-bal(c);if(c.limit&&v>av&&!confirm('Ultrapassa o limite disponível. Lançar mesmo assim?'))return;db.debts.push({id:Date.now(),clientId:c.id,item:it.value.trim()||'Fiado',value:v,paid:0,date:today(),due:due.value});close();save()}
function pay(id){let d=db.debts.find(x=>x.id===id),r=d.value-d.paid,v=+prompt('Saldo: '+money(r)+'\nValor recebido:',r);if(!v||v<=0)return;d.paid=Math.min(d.value,d.paid+v);save()}
function wa(c){let p=(c.phone||'').replace(/\D/g,'');if(!p)return alert('Cadastre o WhatsApp.');if(p.length<=11)p='55'+p;open('https://wa.me/'+p+'?text='+encodeURIComponent('Olá, '+c.name+'! Aqui é da Adega Nove Oito. Seu saldo em aberto é '+money(bal(c))+'.'),'_blank')}
function customer(id){let c=db.clients.find(x=>x.id===id);box.innerHTML='<h2>'+c.name+'</h2><div class="notice">Limite: '+(c.limit?money(c.limit):'não definido')+' • Saldo: '+money(bal(c))+' • Disponível: '+(c.limit?money(Math.max(0,c.limit-bal(c))):'—')+'</div><p class="muted">'+(c.phone||'')+'<br>'+(c.address||'')+'</p><hr><b>Histórico</b><div class="list">'+db.debts.filter(d=>d.clientId===id).slice().reverse().map(d=>'<div class="item"><div class="line"><div><b>'+d.item+'</b><div class="muted">'+d.date+(d.due?' • vence '+d.due:'')+'</div></div><b>'+money(d.value-d.paid)+'</b></div></div>').join('')+'</div><div class="actions"><button class="primary" onclick="close();newDebt('+id+')">+ Fiado</button><button onclick="wa(db.clients.find(x=>x.id==='+id+'))">WhatsApp</button><button onclick="close();newClient('+id+')">Editar</button></div>';modal.classList.add('open')}
function render(){let total=db.clients.reduce((s,c)=>s+bal(c),0),l=db.debts.filter(late).reduce((s,d)=>s+d.value-d.paid,0);document.getElementById('total').textContent=money(total);document.getElementById('late').textContent=money(l);document.getElementById('count').textContent=db.clients.length;
let q=(document.getElementById('search')?.value||'').toLowerCase();clientList.innerHTML=db.clients.filter(c=>c.name.toLowerCase().includes(q)).map(c=>'<div class="item"><div class="line"><div><b>'+c.name+'</b><div class="muted">'+(c.phone||'Sem telefone')+' • Limite '+(c.limit?money(c.limit):'—')+'</div></div><div><b>'+money(bal(c))+'</b><div class="actions"><button onclick="customer('+c.id+')">Abrir</button><button onclick="newDebt('+c.id+')">Fiado</button><button onclick="wa(db.clients.find(x=>x.id==='+c.id+'))">WhatsApp</button></div></div></div></div>').join('')||'<div class="empty">Nenhum cliente.</div>';
debtList.innerHTML=db.debts.slice().reverse().map(d=>{let c=db.clients.find(x=>x.id===d.clientId),r=d.value-d.paid;return '<div class="item"><div class="line"><div><b>'+(c?.name||'Cliente')+'</b><div class="muted">'+d.item+' • '+d.date+(d.due?' • vence '+d.due:'')+'</div></div><div><b>'+money(r)+'</b><div><span class="tag '+(late(d)?'danger':'')+'">'+(r<=0?'PAGO':late(d)?'ATRASADO':'ABERTO')+'</span></div></div></div>'+(r>0?'<div class="actions"><button class="primary" onclick="pay('+d.id+')">Registrar pagamento</button><button onclick="wa(db.clients.find(x=>x.id==='+d.clientId+'))">Cobrar WhatsApp</button></div>':'')+'</div>'}).join('')||'<div class="empty">Nenhum fiado.</div>';
homeList.innerHTML=db.clients.filter(c=>bal(c)>0).sort((a,b)=>bal(b)-bal(a)).slice(0,8).map(c=>'<div class="item"><div class="line"><b>'+c.name+'</b><b>'+money(bal(c))+'</b></div></div>').join('')||'<div class="empty">Nenhum fiado em aberto.</div>';
let sold=db.debts.reduce((s,d)=>s+d.value,0),rec=db.debts.reduce((s,d)=>s+d.paid,0);report.innerHTML='<h3>Relatório geral</h3><p>Total lançado: <b>'+money(sold)+'</b></p><p>Total recebido: <b>'+money(rec)+'</b></p><p>Saldo aberto: <b>'+money(sold-rec)+'</b></p><p>Em atraso: <b class="danger">'+money(l)+'</b></p>'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-adega98-'+today()+'.json';a.click()}
function restore(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clients||!x.debts)throw 0;db=x;save();alert('Backup restaurado.')}catch{alert('Arquivo inválido.')}};r.readAsText(f)}
function demo(){if(db.clients.length&&!confirm('Substituir dados atuais pelos dados de demonstração?'))return;db={clients:[{id:1,name:'João da Silva',phone:'98999999999',limit:100},{id:2,name:'Maria Souza',phone:'98988888888',limit:200}],debts:[{id:10,clientId:1,item:'2 refrigerantes + gelo',value:35,paid:10,date:today(),due:today()},{id:11,clientId:2,item:'Bebidas diversas',value:120,paid:50,date:today(),due:today()}]};save();alert('Dados de demonstração carregados.')}
function wipe(){if(confirm('Apagar TODOS os dados deste navegador?')){db={clients:[],debts:[]};save()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
